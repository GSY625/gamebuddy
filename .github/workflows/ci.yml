name: CI

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:

jobs:
  build-and-migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gamebuddy
          POSTGRES_PASSWORD: gamebuddy
          POSTGRES_DB: gamebuddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamebuddy -d gamebuddy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gamebuddy:gamebuddy@localhost:5432/gamebuddy?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-please-change-in-production
      REFRESH_TOKEN_SECRET: ci-refresh-secret-please-change-in-production
      REFRESH_TOKEN_EXPIRES_IN: 30d
      JWT_EXPIRES_IN: 15m
      ADMIN_EMAILS: 19834864753@163.com
      CORS_ORIGIN: http://localhost:5173
      PUBLIC_BASE_URL: http://localhost:3000
      UPLOAD_DRIVER: local
      UPLOAD_DIR: ./uploads
      VITE_API_URL: http://localhost:3000
      VITE_WS_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prisma generate
        run: npm --prefix server run prisma:generate

      - name: Run migrations
        run: npm --prefix server run db:migrate

      - name: Build workspaces
        run: npm run build
